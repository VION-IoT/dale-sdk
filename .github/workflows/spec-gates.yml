name: Spec Gates
# The SDD gate suite (docs/spec-process.md § Gates): script self-tests, test-style-lint,
# doc-comment-lint, pragma-reason-lint, bom-lint, packed-msbuild-lint, sweep-residue-lint,
# self-reference-lint, and two jobs of their own: the shared journal-lint action, and the vion-sdd
# plugin's action from architecture, which runs spec-lint and spec-trace.
# Its own workflow — not a publish.yml job — because publish.yml skips its build for a docs-only
# change and a docs-only PR (a spec page, a change doc) must still be gated. Pure file scans, no dotnet
# build: cheap enough to run on every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The self-tests' scope diffs a pull request against its base, which needs the history.
          fetch-depth: 0

      # A pull request runs the self-tests only when a script or a project file changed, which is what
      # they read (set-version.tests.ps1 and the packed-assembly gate's self-test read the repository's
      # project files), or when this workflow changed, since it holds the steps that decide whether and
      # how they run. A push to main always runs them. A pull request checks out its merge commit, so its
      # base is the first parent; one that does not resolve runs them. A self-test that reads any other
      # path adds it to the pattern below.
      - name: Scope the self-tests
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          base="$(git rev-parse --verify --quiet HEAD^1 || true)"
          if [ "$EVENT" != "pull_request" ] || [ -z "$base" ]; then
            selftests=true
          elif grep -qE '^scripts/|^\.github/workflows/spec-gates\.yml$|\.csproj$' <<< "$(git diff --name-only --no-renames "$base"...HEAD)"; then
            selftests=true
          else
            selftests=false
          fi
          echo "selftests=$selftests" >> "$GITHUB_OUTPUT"
          echo "selftests=$selftests"

      - name: Script self-tests
        if: steps.scope.outputs.selftests == 'true'
        shell: pwsh
        run: ./scripts/run-script-tests.ps1

      # Settled test style, ratcheting on spec citations: a test that cites an AC id follows
      # testing-conventions §12/§13, and a file citing an id a scenario also claims carries its
      # cross-tier clause (§17).
      - name: Test style lint
        shell: pwsh
        run: ./scripts/test-style-lint.ps1

      # One <summary> per doc block: an insertion anchored below a doc comment steals it, and
      # nothing else — compiler, cleanup, tests — objects. One pass drew that review finding twice.
      - name: Doc-comment lint
        shell: pwsh
        run: ./scripts/doc-comment-lint.ps1

      # A DALE suppression says why: the compiler accepts a bare directive and every test passes, so
      # nothing else asks the author to write down the claim that the shape below it is intended.
      - name: Pragma-reason lint
        shell: pwsh
        run: ./scripts/pragma-reason-lint.ps1

      # No byte-order mark on the file kinds that never carry one here: a helper writing utf-8-sig
      # stamped 46 files in one pass, visible to no gate and to every diff.
      - name: BOM lint
        shell: pwsh
        run: ./scripts/bom-lint.ps1

      # Every MSBuild file packed under a NuGet build folder parses: nothing here imports its own
      # build/*.targets, so a comment containing '--' shipped as 0.12.0 and failed every consumer
      # at MSB4024 with the whole pipeline green.
      - name: Packed MSBuild lint
        shell: pwsh
        run: ./scripts/packed-msbuild-lint.ps1

      # No sweep residue in prose: a scripted reference sweep leaves an orphaned `()`, a doubled
      # space or a line ending on `(` behind; one pass left five such sentences that no gate saw.
      - name: Sweep-residue lint
        shell: pwsh
        run: ./scripts/sweep-residue-lint.ps1

      # No table cell points at itself: `(this PR)` in a pointer column is read after the merge that
      # would have resolved it. Journalled once, then shipped again one commit later.
      - name: Self-reference lint
        shell: pwsh
        run: ./scripts/self-reference-lint.ps1

  # The vion-sdd plugin's two spec gates, spec-lint and spec-trace, from its own scripts at
  # architecture's main, as dale and hardware-integration run them. architecture is private and this
  # repository public, and GitHub shares a private repository's actions with private repositories
  # only, so the plugin is checked out with an App token and its action run from that checkout. A job
  # of its own, so the lints above never walk .vion-sdd/. A missing or revoked key reddens it: the
  # token step fails, it never skips.
  vion-sdd:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint's narrative rule reads lines added since the merge base with the base branch.
          fetch-depth: 0

      # Pinned by COMMIT, not by major tag as the other actions here are: it is handed the App's
      # private key, so what runs is a reviewed commit rather than whatever the tag moves to. v3.3.0.
      - name: A read token for architecture
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.ARCHITECTURE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCHITECTURE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: architecture
          permission-contents: read

      # A freshly minted installation token can be refused for longer than actions/checkout's own
      # three attempts, and the checkout then fails a correct pull request on "Repository not found".
      # Waits for git to accept the token, up to two minutes, so one that never works fails here and
      # says why.
      - name: Wait until architecture accepts the token
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          for attempt in $(seq 1 24); do
            if git ls-remote --heads "https://x-access-token:${TOKEN}@github.com/VION-IoT/architecture.git" main > /dev/null 2>&1; then
              echo "architecture accepted the token on attempt ${attempt}, after ${SECONDS} s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::architecture refused the App token for two minutes: check the App's installation on architecture and the ARCHITECTURE_APP_* secrets"
          exit 1

      - name: The vion-sdd plugin, from architecture's main
        uses: actions/checkout@v4
        with:
          repository: VION-IoT/architecture
          ref: main
          token: ${{ steps.token.outputs.token }}
          path: .vion-sdd
          sparse-checkout: plugins/vion-sdd
          persist-credentials: false

      - uses: ./.vion-sdd/plugins/vion-sdd/action
        with:
          base: ${{ github.base_ref || 'main' }}

  journal-lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: VION-IoT/shared-workflows/actions/journal-lint@v1
