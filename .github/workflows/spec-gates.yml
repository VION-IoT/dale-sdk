name: Spec Gates
# The SDD gate suite (docs/spec-process.md § Gates): script self-tests, spec-lint, spec-trace,
# test-style-lint, doc-comment-lint, pragma-reason-lint, bom-lint, packed-msbuild-lint,
# sweep-residue-lint, self-reference-lint, and the shared journal-lint action as its own job.
# Its own workflow — not a publish.yml job — because publish.yml skips its build for a docs-only
# change and a docs-only PR (a spec page, a change doc) must still be gated. Pure file scans, no dotnet
# build: cheap enough to run on every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # spec-lint -Diff needs the merge base to see what a PR ADDS to docs/specs/.
          fetch-depth: 0

      # A pull request runs the self-tests only when something they read changed: a script, this
      # workflow, or a project file, which set-version.tests.ps1 and the packed-assembly gate's
      # self-test read from the repository. A push to main always runs them. A pull request checks out
      # its merge commit, so its base is the first parent; one that does not resolve runs them.
      - name: Scope the self-tests
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          base="$(git rev-parse --verify --quiet HEAD^1 || true)"
          if [ "$EVENT" != "pull_request" ] || [ -z "$base" ]; then
            selftests=true
          elif grep -qE '^scripts/|^\.github/workflows/spec-gates\.yml$|\.csproj$' <<< "$(git diff --name-only --no-renames "$base"...HEAD)"; then
            selftests=true
          else
            selftests=false
          fi
          echo "selftests=$selftests" >> "$GITHUB_OUTPUT"
          echo "selftests=$selftests"

      - name: Script self-tests
        if: steps.scope.outputs.selftests == 'true'
        shell: pwsh
        run: ./scripts/run-script-tests.ps1

      # On PRs, the narrative rule runs diff-scoped against the base branch (warn-only,
      # per docs/spec-process.md); pushes to main lint without a diff window.
      - name: Spec lint
        shell: pwsh
        run: |
          if ($env:GITHUB_BASE_REF) {
            ./scripts/spec-lint.ps1 -Diff "origin/$env:GITHUB_BASE_REF"
          } else {
            ./scripts/spec-lint.ps1
          }

      - name: Spec trace
        shell: pwsh
        run: ./scripts/spec-trace.ps1

      # Settled test style, ratcheting on spec citations: a test that cites an AC id follows
      # testing-conventions §12/§13. Two passes proved the rule does not hold as prose.
      - name: Test style lint
        shell: pwsh
        run: ./scripts/test-style-lint.ps1

      # One <summary> per doc block: an insertion anchored below a doc comment steals it, and
      # nothing else — compiler, cleanup, tests — objects. One pass drew that review finding twice.
      - name: Doc-comment lint
        shell: pwsh
        run: ./scripts/doc-comment-lint.ps1

      # A DALE suppression says why: the compiler accepts a bare directive and every test passes, so
      # nothing else asks the author to write down the claim that the shape below it is intended.
      - name: Pragma-reason lint
        shell: pwsh
        run: ./scripts/pragma-reason-lint.ps1

      # No byte-order mark on the file kinds that never carry one here: a helper writing utf-8-sig
      # stamped 46 files in one pass, visible to no gate and to every diff.
      - name: BOM lint
        shell: pwsh
        run: ./scripts/bom-lint.ps1

      # Every MSBuild file packed under a NuGet build folder parses: nothing here imports its own
      # build/*.targets, so a comment containing '--' shipped as 0.12.0 and failed every consumer
      # at MSB4024 with the whole pipeline green.
      - name: Packed MSBuild lint
        shell: pwsh
        run: ./scripts/packed-msbuild-lint.ps1

      # No sweep residue in prose: a scripted reference sweep leaves an orphaned `()`, a doubled
      # space or a line ending on `(` behind; one pass left five such sentences that no gate saw.
      - name: Sweep-residue lint
        shell: pwsh
        run: ./scripts/sweep-residue-lint.ps1

      # No table cell points at itself: `(this PR)` in a pointer column is read after the merge that
      # would have resolved it. Journalled once, then shipped again one commit later (T-013, T-014).
      - name: Self-reference lint
        shell: pwsh
        run: ./scripts/self-reference-lint.ps1

  journal-lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: VION-IoT/shared-workflows/actions/journal-lint@v1
