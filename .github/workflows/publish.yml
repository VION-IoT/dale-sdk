name: Pack & Publish
# Jobs:
#   - changes: decides what this run needs from the diff, so a change that cannot affect the
#     build skips it instead of paying for it.
#   - publish: delegates build + test + pack/push to VION-IoT/shared-workflows
#     (publish-nuget.yml, gate: true, run-style: false).
#   - style: the ReSharper cleanupcode gate (scripts/cleanup-code.ps1 -Verify) on its own
#     runner, beside publish instead of after its tests — see the Code Style section in CLAUDE.md.
#   - verify-packages: the artifact gate for the 0.11.1 class — a packed assembly whose
#     AssemblyVersion disagrees with its package version. See the job below for why it
#     runs here and what that placement does not cover.
#   - drift-and-docs: dale-sdk specific — snapshot regen, drift detection,
#     auto-commit on PR heads (main is branch-protected: bot pushes are
#     impossible AND unnecessary — every change lands via a PR whose run
#     already refreshed the snapshots; main drift only warns), push API
#     reference to documentation on main
#   - ci: the one required check. A skipped job counts as passed, so a run that skips
#     everything still reports a result instead of leaving the check waiting.
#
# Every job but ci is gated on github.actor != github-actions[bot] so the snapshot
# auto-commit's push triggers a run where only ci runs, passing on the gates the
# commit's parent already passed, instead of an infinite loop. The previous loop-break
# used a commit-message marker but that marker leaked into squash-merge commits and
# suppressed legitimate post-merge runs.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to a pull request cancels that pull request's previous run. Every other run gets a
  # group of its own: a shared group would let a newer push to main replace an older one still queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dotnet: ${{ steps.scope.outputs.dotnet }}
      style: ${{ steps.scope.outputs.style }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit and a push to main is one squash commit, so
          # the diff base is one parent away. A deeper base does not resolve and runs everything.
          fetch-depth: 2

      # dotnet: false when every changed file is under docs/, examples/, scripts/, .claude/, .github/
      #   outside workflows/, or a root *.md — except docs/package-readme.md, which every package
      #   ships, and the scripts this workflow runs. The examples reference published packages, so an
      #   examples-only change cannot move the SDK; the other scripts are spec-gates.yml's.
      # style: skip (no .cs and no style input changed, or a tag, whose commit main already checked) |
      #   changed (a pull request's changed .cs; the cleanup profile is per-file) | full (a push to
      #   main, a style-input change, a manual run). The full run on main catches an edit that
      #   reformats a file the pull request did not touch.
      # A base that does not resolve runs everything. grep reads here-strings: piped, grep -q's early
      # exit can fail the pipe under pipefail.
      - name: Scope the run
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag - build and publish, style already checked on main"
            { echo "dotnet=true"; echo "style=skip"; echo "base="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request's base is its merge commit's first parent, not pull_request.base.sha: that
          # is the base at the last pull request event, and main may have moved since.
          case "$EVENT" in
            pull_request) base="$(git rev-parse --verify --quiet HEAD^1 || true)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "diff base unresolvable - running everything"
            { echo "dotnet=true"; echo "style=full"; echo "base="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"

          others="$(grep -vE '^(docs/|examples/|scripts/|\.claude/|\.github/|[^/]+\.md$)' <<< "$changed" || true)"
          if [ -n "$others" ] || grep -qE '^(docs/package-readme\.md|\.github/workflows/.*|scripts/(cleanup-code|stage-xml-docs|verify-packed-assembly-versions)\.ps1|scripts/generate-api-reference\.cjs)$' <<< "$changed"; then
            dotnet=true
          else
            dotnet=false
          fi

          if grep -qE '(^|/)\.editorconfig$|\.DotSettings$|^\.config/dotnet-tools\.json$|^scripts/cleanup-code\.ps1$' <<< "$changed"; then
            style=full
          elif ! grep -q '\.cs$' <<< "$changed"; then
            style=skip
          elif [ "$EVENT" = "pull_request" ]; then
            style=changed
          else
            style=full
          fi

          { echo "dotnet=$dotnet"; echo "style=$style"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
          echo "dotnet=$dotnet style=$style"

  publish:
    needs: changes
    if: github.actor != 'github-actions[bot]' && needs.changes.outputs.dotnet == 'true'
    uses: VION-IoT/shared-workflows/.github/workflows/publish-nuget.yml@v1
    with:
      solution: Vion.Dale.Sdk.sln
      # Build + test before packing, in the pack job (one build). The style verify runs in the style
      # job below instead, so it no longer queues behind the tests.
      gate: true
      run-style: false
    permissions:
      contents: read
    secrets: inherit

  # The same cleanup devs and agents run before a PR. It builds the solution itself, as /cleanup
  # does locally.
  style:
    needs: changes
    if: github.actor != 'github-actions[bot]' && needs.changes.outputs.style != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # -Changed diffs against the merge commit's first parent, which the changes job resolved

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: VION-IoT/shared-workflows/actions/setup-nuget-private-feed@v1
        with:
          pat: ${{ secrets.AZURE_DEVOPS_PAT }}

      - name: Verify code style (jb cleanupcode)
        shell: pwsh
        env:
          STYLE: ${{ needs.changes.outputs.style }}
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          if ($env:STYLE -eq 'changed') {
            ./scripts/cleanup-code.ps1 -Verify -Changed -Base $env:BASE
          }
          else {
            ./scripts/cleanup-code.ps1 -Verify
          }

  # Release 0.11.1 shipped three lib assemblies stamped 0.0.0.0 under correct nuspecs and
  # every consumer of them died at startup. The packages were well-formed, the tests were
  # green and the style gate was clean — only the dll bytes were stale, and nothing in the
  # pipeline looked at those. This job does.
  #
  # Placement, honestly: the pack AND both pushes live inside the shared publish job, so
  # this runs after the packages are already on the feeds. It reddens the run and names the
  # package within a minute of a bad tag instead of leaving it to a consumer, which is the
  # difference that mattered in 0.11.1 — but it does not prevent the push. Moving the same
  # script between Pack and Push belongs in VION-IoT/shared-workflows (publish-nuget.yml).
  #
  # Its version check is, by nature, a release-time check: PR and main runs pack 0.0.0-ci.N, whose
  # AssemblyVersion is 0.0.0.0 — the same value a clobbered assembly carries, so the shape
  # is invisible there. What guards the PR is the behavioural test that owns the cause,
  # Vion.Dale.Sdk.Generators.Test/AnalyzerWiringShould. Its lib-asset and required-content
  # checks do not depend on the version, and bite on every run.
  #
  # The script's own -SelfTest runs in spec-gates.yml, through
  # scripts/verify-packed-assembly-versions.tests.ps1.
  verify-packages:
    if: github.actor != 'github-actions[bot]'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: Verify packed assembly versions
        shell: pwsh
        run: ./scripts/verify-packed-assembly-versions.ps1 -PackagesDir ./artifacts

  # Waits for every other gate, not only for the packages it reads: its snapshot commit starts a run
  # that cancels this one and skips every job but ci, so a failure still in flight here would never
  # reach the pull request head.
  drift-and-docs:
    if: >-
      always() && github.actor != 'github-actions[bot]'
      && needs.publish.result == 'success' && needs.verify-packages.result == 'success'
      && (needs.style.result == 'success' || needs.style.result == 'skipped')
    needs: [publish, style, verify-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for snapshot auto-commit on PR head and on main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # main-only steps diff HEAD against HEAD~1
          # Check out the PR head branch on PRs and the pushed branch (e.g. main)
          # on pushes, so the auto-commit can push back to the right ref.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: version
        uses: VION-IoT/shared-workflows/actions/compute-version@v1

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      # The CLI-snapshot step below installs the packed Vion.Dale.Cli — keep the private feed.
      - uses: VION-IoT/shared-workflows/actions/setup-nuget-private-feed@v1
        with:
          pat: ${{ secrets.AZURE_DEVOPS_PAT }}

      # The api-reference generator reads each project's bin/Release/**/*.xml doc file. Those
      # already ship inside the .nupkgs downloaded above (lib/<tfm>/<Assembly>.xml), so stage
      # them into that layout instead of rebuilding the whole solution on this runner — the
      # publish job already built it. The generator parses source + XML only (never loads the
      # assemblies), so no compile is needed here. Verified byte-identical to a rebuild.
      - name: Stage XML docs from packages (skip rebuild)
        if: steps.version.outputs.is_release == 'false'
        shell: pwsh
        run: ./scripts/stage-xml-docs.ps1 -PackagesDir ./artifacts

      - name: Generate API reference and manifest
        if: steps.version.outputs.is_release == 'false'
        run: |
          node scripts/generate-api-reference.cjs \
            --root . --exclude "*.Test" \
            --out api-reference.md \
            --manifest /tmp/publicapi-current.json

      - name: Install packed CLI for snapshot
        if: steps.version.outputs.is_release == 'false' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          dotnet tool install -g Vion.Dale.Cli \
            --add-source ./artifacts \
            --version ${{ steps.version.outputs.version }} \
            --no-cache

      # Auto-commits the regenerated snapshot back to the PR head — before merge, so main always
      # receives fresh snapshots through the PR itself and the HEAD~1-vs-HEAD diff in the notify
      # steps below sees the API-surface change. On main this only WARNS: main is branch-protected
      # (PRs + required checks only), so the bot cannot push to it — and doesn't need to, since
      # every change reaches main via a PR whose run refreshed the snapshots. Residual drift
      # (generator nondeterminism, paths-ignore edge cases) self-heals on the next PR.
      - name: Regenerate snapshots
        id: snapshots
        if: steps.version.outputs.is_release == 'false' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          cp /tmp/publicapi-current.json docs/snapshots/publicapi-manifest.json

          # Walk the command tree rather than a literal list: a new command or subcommand is covered
          # by construction, and a subcommand's OPTIONS are inside the gate (they were not when the
          # loop named only the thirteen top-level commands).
          list_subcommands() {
            dale $1 -h 2>&1               | sed -n '/^Commands:/,/^$/p'               | sed -e '1d' -e '/^$/d' -e 's/^ *//'               | cut -d' ' -f1               | grep -E '^[a-z][a-z-]*$' || true
          }

          {
            dale -h
            for cmd in $(list_subcommands ""); do
              echo "---"
              echo "## dale $cmd"
              dale $cmd -h 2>&1
              for sub in $(list_subcommands "$cmd"); do
                echo "---"
                echo "## dale $cmd $sub"
                dale $cmd $sub -h 2>&1
              done
            done
          } > docs/snapshots/cli-help-snapshot.txt

          git add docs/snapshots/publicapi-manifest.json docs/snapshots/cli-help-snapshot.txt
          if git diff --cached --quiet; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Snapshots are up to date"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit snapshots to the PR head
        if: steps.snapshots.outputs.drift == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # No [skip ci] marker — the job-level actor guard above breaks
          # the loop when the resulting push retriggers the workflow.
          git commit -m "Update PublicApi manifest and CLI help snapshot"
          git push origin HEAD:${{ github.head_ref }}
          echo "::notice::Auto-updated docs snapshots"

      - name: Report snapshot drift on main (warn only — branch protection forbids bot pushes)
        if: steps.snapshots.outputs.drift == 'true' && github.event_name == 'push'
        run: |
          echo "::warning::Docs snapshots drifted on main. They self-heal with the next PR's auto-commit; to fix sooner, regenerate them in any PR."
          git diff --cached --stat
          git reset --hard HEAD

      - name: Notify architecture of PublicApi surface changes (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true   # don't cascade-skip the docs-push step on a notify failure
        env:
          GH_TOKEN: ${{ secrets.ARCHITECTURE_REPO_PAT }}
        run: |
          if git show HEAD~1:docs/snapshots/publicapi-manifest.json > /tmp/publicapi-prev.json 2>/dev/null; then
            ADDED=$(comm -13 \
              <(jq -r '.types[]' /tmp/publicapi-prev.json | sort) \
              <(jq -r '.types[]' docs/snapshots/publicapi-manifest.json | sort))
            REMOVED=$(comm -23 \
              <(jq -r '.types[]' /tmp/publicapi-prev.json | sort) \
              <(jq -r '.types[]' docs/snapshots/publicapi-manifest.json | sort))
            NEW_ASM=$(comm -13 \
              <(jq -r '.assemblies[]' /tmp/publicapi-prev.json | sort) \
              <(jq -r '.assemblies[]' docs/snapshots/publicapi-manifest.json | sort))

            if [ -n "$ADDED" ] || [ -n "$REMOVED" ] || [ -n "$NEW_ASM" ]; then
              BODY="The Vion Dale SDK public API surface has changed."
              [ -n "$NEW_ASM" ] && BODY="$BODY

          **New assemblies:**
          \`\`\`
          $NEW_ASM
          \`\`\`"
              [ -n "$ADDED" ] && BODY="$BODY

          **New types:**
          \`\`\`
          $ADDED
          \`\`\`"
              [ -n "$REMOVED" ] && BODY="$BODY

          **Removed types:**
          \`\`\`
          $REMOVED
          \`\`\`"
              BODY="$BODY

          The API reference page updates automatically. Other docs pages that may need updating:
          - New attributes → \`docs/sdk/properties.md\` or \`docs/sdk/logic-blocks.md\`
          - New I/O types → \`docs/sdk/services.md\`
          - New assemblies → may need a new docs section"

              gh issue create \
                --repo VION-IoT/architecture \
                --title "Vion Dale SDK public API surface changed" \
                --body "$BODY"
            else
              echo "PublicApi surface unchanged"
            fi
          fi

      - name: Notify architecture of CLI help changes (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true   # don't cascade-skip the docs-push step on a notify failure
        env:
          GH_TOKEN: ${{ secrets.ARCHITECTURE_REPO_PAT }}
        run: |
          if git show HEAD~1:docs/snapshots/cli-help-snapshot.txt > /tmp/cli-help-prev.txt 2>/dev/null; then
            if ! diff -q /tmp/cli-help-prev.txt docs/snapshots/cli-help-snapshot.txt > /dev/null 2>&1; then
              DIFF=$(diff -u /tmp/cli-help-prev.txt docs/snapshots/cli-help-snapshot.txt | head -200)

              gh issue create \
                --repo VION-IoT/architecture \
                --title "Vion Dale CLI help changed — docs may need updating" \
                --body "$(cat <<BODY
          The Vion Dale CLI help output has changed. Review and update documentation as needed.

          \`\`\`diff
          ${DIFF}
          \`\`\`

          **Likely affected pages:**
          - \`docs/sdk/installation.md\` (CLI command reference)
          - \`docs/sdk/publishing.md\` (upload/auth commands)
          - \`docs/introduction/quick-start.md\` (getting started flow)
          BODY
          )"
            else
              echo "CLI help unchanged"
            fi
          fi

      - name: Push API reference to docs repo (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.DOCS_REPO_PAT }}@github.com/VION-IoT/documentation.git /tmp/docs
          mkdir -p /tmp/docs/docs/api-reference
          cp api-reference.md /tmp/docs/docs/api-reference/index.md
          cd /tmp/docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api-reference/index.md
          if git diff --cached --quiet; then
            echo "API reference unchanged"
          else
            git commit -m "Update SDK API reference (auto-generated)"
            git push
          fi
          rm -rf /tmp/docs

  # The required check. Branch protection names this one job instead of each job above, so a job
  # skipped by the changes job, or added later, never leaves a pull request waiting on a check that
  # will not report. A skipped job passes; a failed or cancelled one fails this.
  ci:
    if: always()
    needs: [changes, publish, style, verify-packages, drift-and-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if grep -qE '"result":[[:space:]]*"(failure|cancelled)"' <<< "$NEEDS"; then
            exit 1
          fi
